name: Michigan Pool Automation

on:
  schedule:
    # Runs every Sunday at 5:00 PM EDT (21:00 UTC)
    - cron: '0 21 * * 0'
  workflow_dispatch:

jobs:
  run-tracker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install resend requests

      - name: Run automation script
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: python scripts/update_and_score.py

      - name: Auto Commit & Push Updates
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automated data and score update"
          file_pattern: "data.json"
